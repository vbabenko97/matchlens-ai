name: Deploy demo (Azure Static Web Apps, Free)

# Manual only. Requires the operator to create a FREE-plan Static Web App and store its
# deployment token as the AZURE_STATIC_WEB_APPS_API_TOKEN repository secret. The site is the
# offline, deterministic static export: it contains no Azure credentials.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-swa
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.swa.outputs.static_web_app_url }}
    steps:
      - name: Require deployment token
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::AZURE_STATIC_WEB_APPS_API_TOKEN is not set. Operator step: create the Free Static Web App and add its deployment token (docs/DEPLOYMENT.md)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - run: python -m matchlens export-site --offline --agent-trace docs/evidence/agent-trace-2026-10-24.json --out site
      - run: cp deploy/azure-static-web-apps/staticwebapp.config.json site/
      - id: swa
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site
          api_location: ""
          output_location: ""
          skip_app_build: true

  smoke:
    needs: deploy
    uses: ./.github/workflows/public-smoke.yml
    with:
      url: ${{ needs.deploy.outputs.url }}
