name: Deploy demo (GitHub Pages, fallback)

# Manual only. Requires Settings -> Pages -> Source: "GitHub Actions" (operator step).
# Publishes the offline, deterministic static export; no credentials are involved.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - run: python -m matchlens export-site --offline --out site && touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    outputs:
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4

  smoke:
    needs: deploy
    uses: ./.github/workflows/public-smoke.yml
    with:
      url: ${{ needs.deploy.outputs.url }}
